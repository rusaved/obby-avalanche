<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="%BODY_BG%" />
    <link rel="icon" href="data:," />
    <title>%GAME_TITLE%</title>
    <script>window.__T0=performance.now();window.__ANALYTICS_BUFFER__=[{name:"load_start",t:0}];</script>
    <!--METRIKA-->
    <script src="/sdk.js"></script>
    <style>
      html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:%BODY_BG%;}
      body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
      #app{position:absolute;inset:0;background:%BODY_BG%;}
      #game{position:absolute;left:0;top:0;display:block;touch-action:none;outline:none;}
      #preloader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:%BODY_BG%;z-index:50;transition:opacity .3s;}
      #preloader.hidden{opacity:0;pointer-events:none;}
      .spinner{width:44px;height:44px;border-radius:50%;border:5px solid rgba(255,255,255,.55);border-top-color:#fff;animation:spin .9s linear infinite;box-shadow:0 2px 10px rgba(0,0,0,.08);}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game" tabindex="0"></canvas>
      <div id="ui"></div>
      <div id="preloader" aria-hidden="true"><div class="spinner"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
